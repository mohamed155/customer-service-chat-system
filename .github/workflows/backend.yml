name: Backend
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege for every job (MOH-39). A job that needs more declares it itself.
permissions:
  contents: read
jobs:
  verify:
    outputs:
      test_count: ${{ steps.tests.outputs.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: customer_service, POSTGRES_USER: customer_service, POSTGRES_PASSWORD: customer_service }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U customer_service" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      # Two roles, as in every environment (ADR-004 section 3): migrations and test setup run as
      # the schema owner, the code under test as app_runtime, which RLS applies to.
      MIGRATION_DATABASE_URL: postgres://app_owner:app_owner_ci@localhost:5432/customer_service
      DATABASE_URL: postgres://app_runtime:app_runtime_ci@localhost:5432/customer_service
      AUTH_JWT_SECRET: 0123456789abcdef0123456789abcdef
      REQUIRE_DB_TESTS: "1"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - name: Create database extensions and roles
        # The service container does not run infra/postgres/init, so run the same scripts here.
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: customer_service
          POSTGRES_USER: customer_service
          POSTGRES_DB: customer_service
          APP_OWNER_PASSWORD: app_owner_ci
          APP_RUNTIME_PASSWORD: app_runtime_ci
          ROLES_REQUIRED: "1"
        run: |
          bash infra/postgres/init/01-extensions.sh
          bash infra/postgres/init/02-roles.sh
      - run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - run: sqlx migrate run --database-url "$MIGRATION_DATABASE_URL"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-nextest }
      - id: tests
        name: Run tests and verify count floor
        run: |
          set -o pipefail
          EXIT=0
          cargo nextest run --workspace 2>&1 | tee /tmp/nextest.out || EXIT=$?
          test $EXIT -eq 0 || exit $EXIT
          COUNT=$(grep -oP '\d+(?= tests run)' /tmp/nextest.out || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          FLOOR=$(cat ../specs/033-production-hardening/baseline-test-count.txt)
          if [ "$COUNT" -lt "$FLOOR" ]; then
            echo "FAIL: $COUNT tests run < floor $FLOOR"
            exit 1
          fi
          echo "OK: $COUNT tests run >= floor $FLOOR"
      - run: cargo install cargo-audit
      - run: cargo audit
  secret-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1
  release:
    needs: [verify, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: docker buildx build --push -f infra/Dockerfile.backend -t ghcr.io/${{ github.repository }}-backend:${{ github.sha }} .
      - name: Build and push dashboard image
        run: docker buildx build --push -f infra/Dockerfile.frontend --build-arg APP=dashboard -t ghcr.io/${{ github.repository }}-dashboard:${{ github.sha }} .
      # The dashboard's source maps, alone in an image of their own (MOH-168). They are not in the
      # dashboard image above. Keep this package PRIVATE in the repository's package settings: the
      # maps show the source of a build. A browser error report names the build (its `release` is
      # the hash of the main script), and `frontend/tools/symbolicate.mjs` reads the stack with them.
      - name: Build and push dashboard source maps (private package)
        run: docker buildx build --push -f infra/Dockerfile.frontend --build-arg APP=dashboard --target sourcemaps -t ghcr.io/${{ github.repository }}-dashboard-sourcemaps:${{ github.sha }} .
      - name: Build and push widget image
        run: docker buildx build --push -f infra/Dockerfile.frontend --build-arg APP=widget -t ghcr.io/${{ github.repository }}-widget:${{ github.sha }} .
      - name: Create release manifest
        run: |
          cat > release-manifest.json <<EOF
          {
            "commit_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run_id": "${{ github.run_id }}",
            "tests_executed": ${{ needs.verify.outputs.test_count }},
            "images": {
              "backend": "ghcr.io/${{ github.repository }}-backend:${{ github.sha }}",
              "dashboard": "ghcr.io/${{ github.repository }}-dashboard:${{ github.sha }}",
              "dashboard_sourcemaps": "ghcr.io/${{ github.repository }}-dashboard-sourcemaps:${{ github.sha }}",
              "widget": "ghcr.io/${{ github.repository }}-widget:${{ github.sha }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json

