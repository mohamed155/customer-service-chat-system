name: CI
# Repository-level checks that do not belong to one app (Phase 0, MOH-25). Backend and frontend
# keep their own workflows (backend.yml, frontend.yml). This file holds the commit lint (MOH-25) and
# the docs and Compose checks (MOH-26). Secret scanning is added by MOH-27.
#
# - Runs on every pull request and on every push to master (the trunk).
# - `edited` is in the pull_request types so the PR title is re-checked after a rename. A title edit
#   changes nothing else, so every job except `commitlint` must skip it with
#   `if: github.event.action != 'edited'`.
# - Every action is pinned to a full commit SHA, with the tag in a trailing comment. Third-party
#   code in CI can read secrets, and a tag can be moved.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]
concurrency:
  # A newer run cancels the older one for the same PR or branch. A title edit gets its own group so
  # it never cancels a code run that is still going.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true
# Least privilege for every job. A job that needs more declares it itself.
permissions:
  contents: read
jobs:
  # Conventional Commits on the PR title and on every commit in the PR (config: commitlint.config.mjs).
  # The job name is a required status check on master: do not rename it without updating the ruleset.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.34.4, run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: frontend/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm --dir frontend exec commitlint --config ../commitlint.config.mjs
      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir frontend exec commitlint --config ../commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # markdownlint on docs/ and the root markdown files. Rules and the disabled ones are in
  # .markdownlint-cli2.jsonc. The action bundles markdownlint-cli2 0.24.0; keep the globs below in
  # step with that file. Run it locally with: npx markdownlint-cli2@0.24.0
  docs-lint:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            docs/**/*.md
            *.md

  # Internal links must resolve: a relative link to a file that does not exist, or to a heading that
  # does not exist, fails the build. --offline means lychee never touches the network here, so this
  # job cannot flake.
  docs-links:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          jobSummary: true
          args: --offline --include-fragments --no-progress 'docs/**/*.md' '*.md'

  # External links only warn. A third-party site being down or slow must not block a merge, so this
  # job never fails on a broken link: it annotates the run instead. Do not make it a required check.
  docs-links-external:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: false
          jobSummary: true
          # 403 and 429 are bot blocking and rate limiting, not dead links. Loopback addresses
          # (the http://localhost:... dev URLs in the README) can never resolve on a runner, so they
          # are skipped; otherwise the warning would be permanent and nobody would read it.
          args: >-
            --scheme http --scheme https --exclude-loopback --no-progress --timeout 20
            --max-retries 2 --accept '100..=103,200..=299,403,429' 'docs/**/*.md' '*.md'
      - name: Warn about broken external links
        if: steps.lychee.outputs.exit_code != '0'
        run: echo "::warning title=Broken external links::lychee found external links that did not resolve. See the job summary. This does not fail the build."

  # The Compose files must parse for every profile and for the staging overlay. Same commands as the
  # "Compose files parse" step in infra.yml, but they run on every pull request, not only when infra/
  # changes.
  compose-config:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: docker compose config
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml config -q
          docker compose --env-file .env.example --profile observability -f infra/docker-compose.yml config -q
          touch .env.staging
          APP_RELEASE_SHA=ci APP_DOMAIN=example.test \
            docker compose --env-file .env.example -f infra/docker-compose.yml -f infra/docker-compose.staging.yml config -q

  # Supply chain (MOH-39, ADR-015 section 3, threat model 4.14 S): every `uses:` must be pinned to a
  # full commit SHA with the tag in a trailing comment, and every workflow must declare top-level
  # `permissions:`. Dependabot keeps the SHAs current (.github/dependabot.yml). The script is plain
  # Node with no dependencies; its tests run first. Run both locally from the repository root:
  #   node --test .github/scripts/check-workflows.test.mjs && node .github/scripts/check-workflows.mjs
  # Needs no secrets and no checkout credentials, so it is safe on pull requests from forks.
  workflow-pinning:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Checker tests
        run: node --test .github/scripts/check-workflows.test.mjs
      - name: Workflows are pinned and least-privilege
        run: node .github/scripts/check-workflows.mjs

  # API contract (MOH-43, ADR-012 gap A5). `docs/api/openapi.json` is the committed OpenAPI document;
  # the backend test `openapi_snapshot` (in `verify`) fails when it is stale. This job compares it
  # with the base branch and fails on a breaking change for API clients: a removed endpoint, a new
  # required request field, a narrowed response, and so on (oasdiff's ERR level).
  #
  # A deliberate breaking change is allowed by the pull request label `breaking-api-change`; the
  # changes are still listed. oasdiff runs here as a pinned release binary with a checksum, like
  # `just` in infra.yml, and only on local files: nothing is uploaded and no third-party action
  # runs. The self-test first proves the gate is armed, so a broken install can't turn the check
  # into a silent pass.
  openapi-breaking:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: "1.35.0"
      # From checksums.txt of the release (oasdiff_1.35.0_linux_amd64.tar.gz).
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install oasdiff (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Self-test, a removed endpoint is flagged and an unchanged document is not
        run: |
          cat > "$RUNNER_TEMP/with-b.json" <<'JSON'
          {"openapi":"3.1.0","info":{"title":"t","version":"1"},"paths":{"/a":{"get":{"operationId":"a","responses":{"200":{"description":"ok"}}}},"/b":{"get":{"operationId":"b","responses":{"200":{"description":"ok"}}}}}}
          JSON
          cat > "$RUNNER_TEMP/without-b.json" <<'JSON'
          {"openapi":"3.1.0","info":{"title":"t","version":"1"},"paths":{"/a":{"get":{"operationId":"a","responses":{"200":{"description":"ok"}}}}}}
          JSON
          oasdiff breaking --fail-on ERR "$RUNNER_TEMP/with-b.json" "$RUNNER_TEMP/with-b.json"
          if oasdiff breaking --fail-on ERR "$RUNNER_TEMP/with-b.json" "$RUNNER_TEMP/without-b.json"; then
            echo "::error::oasdiff did not flag a removed endpoint, so this check cannot be trusted"
            exit 1
          fi
      - name: Compare docs/api/openapi.json with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if ! git cat-file -e "$BASE_SHA:docs/api/openapi.json" 2>/dev/null; then
            echo "::notice::The base branch has no docs/api/openapi.json yet, so there is nothing to compare."
            exit 0
          fi
          git show "$BASE_SHA:docs/api/openapi.json" > "$RUNNER_TEMP/base.json"
          status=0
          oasdiff breaking --fail-on ERR "$RUNNER_TEMP/base.json" docs/api/openapi.json || status=$?
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$PR_LABELS" | grep -q '"breaking-api-change"'; then
              echo "::warning::Breaking API changes (listed above), allowed by the breaking-api-change label."
              exit 0
            fi
            echo "::error::Breaking API changes (listed above). If they are intended, add the pull request label 'breaking-api-change' and describe the migration in the pull request."
            exit "$status"
          fi
