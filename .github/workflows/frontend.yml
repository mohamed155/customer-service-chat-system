name: Frontend
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege for every job (MOH-39). A job that needs more declares it itself.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.34.4, run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: frontend/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      # infra/Dockerfile.frontend installs from package.json + lockfile only, with no git checkout.
      # The release job (master only) builds that image, so reproduce its install on pull requests.
      - name: Install works without a git checkout (Docker image build)
        run: |
          dir=$(mktemp -d)
          cp package.json pnpm-lock.yaml "$dir"
          cd "$dir" && pnpm install --frozen-lockfile
      # The TypeScript types are generated from the committed OpenAPI document (MOH-43). After an API
      # change: `UPDATE_OPENAPI=1 cargo test -p server --test openapi_snapshot`, then `pnpm gen:api`.
      - name: Generated API types are current
        run: |
          pnpm gen:api
          if [ -n "$(git status --porcelain -- apps/dashboard/src/app/core/api/generated)" ]; then
            git --no-pager diff --stat -- apps/dashboard/src/app/core/api/generated
            echo "::error::apps/dashboard/src/app/core/api/generated is out of date. Run 'pnpm gen:api' in frontend/ and commit the result."
            exit 1
          fi
      - run: pnpm run lint
      - name: No new hard-coded user-facing text (ADR-016)
        run: pnpm lint:i18n
      - name: The hard-coded text check works
        run: pnpm test:i18n-check
      - name: Every workspace store resets on a workspace change (MOH-61)
        run: pnpm lint:tenant-scope
      - name: The tenant-scope check works
        run: pnpm test:tenant-scope-check
      - name: Check formatting
        run: pnpm format:check
      - run: pnpm exec ng build dashboard
      - run: pnpm exec ng build widget
      - name: Build widget loader
        run: pnpm build:widget-loader
      # Starts `ng serve widget` against a local upstream (MOH-51); no browser needed.
      - name: Widget dev-server proxy test
        run: pnpm test:widget-proxy
      - run: pnpm exec ng test dashboard --watch=false
      - run: pnpm exec ng test widget --watch=false
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      # Runs after the widget build: the widget specs serve dist/widget.
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7

  real-backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: customer_service_e2e
          POSTGRES_USER: customer_service
          POSTGRES_PASSWORD: customer_service_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U customer_service -d customer_service_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # The backend runs as app_runtime; migrations and the e2e seed files (which TRUNCATE) use
      # the schema owner.
      MIGRATION_DATABASE_URL: postgres://app_owner:app_owner_e2e@127.0.0.1:5432/customer_service_e2e
      DATABASE_URL: postgres://app_runtime:app_runtime_e2e@127.0.0.1:5432/customer_service_e2e
      REDIS_URL: redis://127.0.0.1:6379
      APP_ENVIRONMENT: development
      AUTH_JWT_SECRET: t150-ci-auth-jwt-secret-at-least-32-bytes
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4201
      PUBLIC_DASHBOARD_URL: http://127.0.0.1:4201
      E2E_BACKEND_PORT: 18080
      BIND_ADDRESS: 127.0.0.1
      CI_REAL_BACKEND: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral AI key encryption key
        run: |
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "APP_AI_KEY_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: backend
      - run: rustc --version
        working-directory: backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.34.4, run_install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: frontend/pnpm-lock.yaml,
          }
      - name: Create database extensions and roles
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: customer_service_e2e
          POSTGRES_USER: customer_service
          POSTGRES_DB: customer_service_e2e
          APP_OWNER_PASSWORD: app_owner_e2e
          APP_RUNTIME_PASSWORD: app_runtime_e2e
          ROLES_REQUIRED: "1"
        run: |
          bash infra/postgres/init/01-extensions.sh
          bash infra/postgres/init/02-roles.sh
      - name: Apply and verify database migrations
        working-directory: backend
        env:
          REQUIRE_DB_TESTS: 1
        run: cargo test -p db --test schema run_migrations_succeeds -- --exact
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps
      - name: Validate mandatory real-stack wiring
        working-directory: frontend
        run: node --test e2e/real-backend-workflow.validation.test.mjs
      - name: Run real-backend tenant team workflow
        working-directory: frontend
        run: pnpm test:e2e:real
