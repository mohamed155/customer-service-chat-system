name: Commitlint
# Conventional Commits on the PR title and on every commit in the PR (config: commitlint.config.mjs).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: frontend/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm --dir frontend exec commitlint --config ../commitlint.config.mjs
      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir frontend exec commitlint --config ../commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
