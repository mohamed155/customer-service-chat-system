[workspace]
resolver = "2"
members = [
  "crates/server", "crates/shared/*", "crates/modules/*", "crates/ai-providers"
]
exclude = ["crates/modules/telegram"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid", "openapi_extensions"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }
tower-http = { version = "0.7", features = ["cors", "catch-panic", "set-header"] }
async-trait = "0.1"
argon2 = "0.6"
axum-extra = { version = "0.12", features = ["cookie"] }
futures = "0.3"
http-body-util = "0.1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
rand = "0.10"
serial_test = "4"
hex = "0.4"
getrandom = "0.4"
sha2 = "0.11"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
aes-gcm = "0.11"
base64 = "0.23"
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
zeroize = { version = "1", features = ["derive"] }
wiremock = "0.6"
ammonia = "4"
pdf-extract = "0.12"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
regex = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = { version = "0.33", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "metrics", "grpc-tonic"] }
tracing-opentelemetry = "0.34"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "logs", "metrics", "panic", "release-health", "reqwest", "rustls"] }
sentry-tracing = "0.49"
dotenvy = "0.15"
