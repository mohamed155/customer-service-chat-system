@if (hasContent) {
  <div class="result-viewer">
    <button class="toggle-btn" (click)="toggle()" type="button">
      <span class="toggle-icon">{{ expanded ? '▾' : '▸' }}</span>
      <span>{{ (expanded ? 'toolResult.hide' : 'toolResult.show') | transloco }}</span>
    </button>
    @if (expanded) {
      <div class="content">
        @if (error(); as err) {
          <div class="error-section">
            <strong>{{ 'toolResult.error' | transloco }}</strong>
            <pre class="error-text">{{ err }}</pre>
          </div>
        }
        @if (result(); as res) {
          <div class="result-section">
            <strong>{{ 'toolResult.result' | transloco }}</strong>
            <pre class="result-json">{{ prettyPrint(res) }}</pre>
          </div>
        }
      </div>
    }
  </div>
}
