<span
  >{{ 'errorReference.ref' | transloco }}
  <code data-testid="reference">{{ reference() }}</code></span
>
<button type="button" (click)="copy()" [attr.aria-label]="'errorReference.copyLabel' | transloco">
  @switch (copied()) {
    @case ('copied') {
      {{ 'errorReference.copied' | transloco }}
    }
    @case ('failed') {
      {{ 'errorReference.failed' | transloco }}
    }
    @default {
      {{ 'errorReference.copy' | transloco }}
    }
  }
</button>
