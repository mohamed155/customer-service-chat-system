<app-dialog-shell
  [open]="stepUp.open()"
  ariaLabelledby="step-up-title"
  ariaDescribedby="step-up-desc"
  [dismissDisabled]="stepUp.pending()"
  (dismiss)="cancel()"
>
  <form (submit)="$event.preventDefault(); submit()">
    <h3 id="step-up-title">{{ 'stepUp.title' | transloco }}</h3>
    <p id="step-up-desc">
      {{ (usingRecovery() ? 'stepUp.recoveryHint' : 'stepUp.codeHint') | transloco }}
    </p>
    <label for="step-up-credential">
      {{ (usingRecovery() ? 'stepUp.recoveryLabel' : 'stepUp.codeLabel') | transloco }}
      @if (usingRecovery()) {
        <input
          id="step-up-credential"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          [formControl]="credential"
        />
      } @else {
        <input
          id="step-up-credential"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          [formControl]="credential"
        />
      }
    </label>
    @if (stepUp.errorMessage(); as message) {
      <app-inline-alert tone="error">{{ message }}</app-inline-alert>
    }
    <div class="actions">
      <button type="button" class="link" (click)="toggleRecovery()">
        {{ (usingRecovery() ? 'stepUp.useCode' : 'stepUp.useRecovery') | transloco }}
      </button>
      <app-button variant="secondary" (pressed)="cancel()">{{
        'common.cancel' | transloco
      }}</app-button>
      <app-button
        variant="primary"
        type="submit"
        [disabled]="stepUp.pending() || credential.invalid"
      >
        {{ (stepUp.pending() ? 'stepUp.checking' : 'stepUp.continue') | transloco }}
      </app-button>
    </div>
  </form>
</app-dialog-shell>
