<label>
  <span class="sr-only">{{ placeholder() }}</span>
  <tui-icon icon="@tui.search" />
  <input
    type="search"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="updateValue($event)"
    (keydown.enter)="searchSubmit.emit(value())"
  />
  @if (shortcutHint()) {
    <kbd>{{ shortcutHint() }}</kbd>
  }
</label>
