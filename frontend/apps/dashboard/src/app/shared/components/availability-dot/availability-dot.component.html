<span
  class="dot"
  [class.available]="state() === 'available'"
  [class.away]="state() === 'away'"
  [attr.aria-label]="state() === 'available' ? 'Available' : 'Away'"
>
  @if (state() === 'available') {
    <tui-icon icon="@tui.circle-check" />
  }
  @if (state() === 'away') {
    <tui-icon icon="@tui.circle-minus" />
  }
</span>
