<div class="avatar-picker">
  <span class="label">{{ 'ai-agent.avatar.label' | transloco }}</span>

  <div class="preset-grid">
    @for (preset of presets(); track preset) {
      <button
        type="button"
        class="preset-btn"
        [class.selected]="isPresetSelected(preset)"
        (click)="value.set({ kind: 'preset', preset })"
      >
        {{ presetKey(preset) ? (presetKey(preset)! | transloco) : preset }}
      </button>
    }
  </div>

  <app-button variant="secondary" (pressed)="fileInput.click()">
    {{ 'ai-agent.avatar.upload' | transloco }}
  </app-button>
  <input
    #fileInput
    type="file"
    accept="image/png,image/jpeg,image/webp"
    (change)="handleFile($event)"
    hidden
  />

  @if (uploadError(); as err) {
    <app-inline-alert tone="error">{{ err.key | transloco: err.params }}</app-inline-alert>
  }
</div>
