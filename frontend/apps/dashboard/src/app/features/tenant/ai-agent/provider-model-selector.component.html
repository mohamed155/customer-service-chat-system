<div class="selector">
  <label class="label" for="ai-provider-select">{{ 'ai-agent.provider.label' | transloco }}</label>
  <select
    id="ai-provider-select"
    [ngModel]="value().providerId"
    (ngModelChange)="setProvider($event)"
  >
    <option [ngValue]="null">{{ 'ai-agent.provider.platformDefault' | transloco }}</option>
    @for (provider of availableProviders(); track provider.id) {
      <option [ngValue]="provider.id">{{ provider.name }}</option>
    }
  </select>

  @if (value().providerId) {
    <label class="label" for="ai-model-select">{{ 'ai-agent.provider.model' | transloco }}</label>
    <select id="ai-model-select" [ngModel]="value().model" (ngModelChange)="setModel($event)">
      <option [ngValue]="null">{{ 'ai-agent.provider.platformDefault' | transloco }}</option>
      @for (model of selectedModels(); track model) {
        <option [ngValue]="model">{{ model }}</option>
      }
    </select>
  }

  @if (stale()) {
    <app-inline-alert tone="info">{{ 'ai-agent.provider.stale' | transloco }}</app-inline-alert>
  }
</div>
