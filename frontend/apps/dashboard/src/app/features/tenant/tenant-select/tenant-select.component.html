<app-page-container>
  <app-page-header
    [title]="'tenantSelect.title' | transloco"
    [description]="'tenantSelect.description' | transloco"
  />
  @if (hasMemberships()) {
    <app-empty-state
      icon="@tui.ban"
      [title]="'tenantSelect.noneSelectedTitle' | transloco"
      [description]="'tenantSelect.noneSelectedDescription' | transloco"
    >
      <a [routerLink]="APP_PATHS.tenant.base">{{ 'tenantSelect.back' | transloco }}</a>
    </app-empty-state>
  } @else {
    <app-empty-state
      icon="@tui.shield-off"
      [title]="'tenantSelect.noAccessTitle' | transloco"
      [description]="'tenantSelect.noAccessDescription' | transloco"
    />
  }
</app-page-container>
