<div class="page">
  <div class="page-header">
    <h2>{{ 'insights.notifications.title' | transloco }}</h2>
    @if (store.unreadCount() > 0) {
      <button type="button" class="mark-all-btn" (click)="store.markAllRead()">
        <tui-icon icon="@tui.check-check" />
        {{ 'insights.notifications.markAllRead' | transloco }}
      </button>
    }
  </div>
  <div class="page-body">
    <app-notification-list
      [items]="store.items()"
      [loading]="store.loading()"
      [hasMore]="store.hasMore()"
      (itemClick)="onItemClick($event)"
      (markRead)="store.markRead($event)"
      (loadMore)="store.loadMore()"
    />
  </div>
</div>
