@if (feedbackCount() > 0) {
  <div class="summary-card">
    <span class="average">{{ averageDisplay() }}</span>
    <span class="caption">{{
      'conversations.satisfaction.from' | transloco: { count: feedbackCount() }
    }}</span>
  </div>
} @else {
  <div class="summary-card empty">
    <span class="caption">{{ 'conversations.satisfaction.none' | transloco }}</span>
  </div>
}
