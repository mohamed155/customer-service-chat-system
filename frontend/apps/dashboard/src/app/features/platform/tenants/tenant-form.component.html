<app-page-container>
  <app-page-header
    [title]="
      (isEditMode() ? 'platform.tenantForm.editTitle' : 'platform.tenantForm.newTitle') | transloco
    "
    [description]="
      (isEditMode() ? 'platform.tenantForm.editDescription' : 'platform.tenantForm.newDescription')
        | transloco
    "
  />

  @if (!canManage()) {
    <app-empty-state
      icon="@tui.shield-off"
      [title]="'platform.tenantForm.notPermittedTitle' | transloco"
      [description]="'platform.tenantForm.notPermittedDescription' | transloco"
    />
  } @else if (loadingInitial()) {
    <app-loading-state [label]="'platform.tenantForm.loading' | transloco" />
  } @else if (editInitFailed()) {
    <app-empty-state
      icon="@tui.alert-circle"
      [title]="'platform.tenantForm.loadErrorTitle' | transloco"
      [description]="'platform.tenantForm.loadErrorDescription' | transloco"
    >
      <button type="button" class="primary-button" (click)="retryLoad()">
        {{ 'platform.tenantForm.retry' | transloco }}
      </button>
    </app-empty-state>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" novalidate>
      <label class="field">
        <span>{{ 'platform.tenantForm.displayName' | transloco }}</span>
        <input
          type="text"
          formControlName="name"
          maxlength="200"
          autocomplete="off"
          [attr.aria-invalid]="ariaInvalid('name') ? 'true' : null"
          [attr.aria-describedby]="ariaInvalid('name') ? errorIdFor('name') : null"
        />
        @if (showError('name')) {
          <small [id]="errorIdFor('name')" class="error">{{
            errorKeyFor('name') | transloco
          }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'platform.tenantForm.slug' | transloco }}</span>
        <input
          type="text"
          formControlName="slug"
          [attr.maxlength]="slugMaxLength"
          autocomplete="off"
          [attr.aria-invalid]="ariaInvalid('slug') ? 'true' : null"
          [attr.aria-describedby]="ariaInvalid('slug') ? errorIdFor('slug') : null"
        />
        <small class="hint">{{
          'platform.tenantForm.slugHint' | transloco: { max: slugMaxLength }
        }}</small>
        @if (showError('slug')) {
          <small [id]="errorIdFor('slug')" class="error">{{
            errorKeyFor('slug') | transloco
          }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'platform.tenantForm.plan' | transloco }}</span>
        <select
          formControlName="plan"
          [attr.aria-invalid]="ariaInvalid('plan') ? 'true' : null"
          [attr.aria-describedby]="ariaInvalid('plan') ? errorIdFor('plan') : null"
        >
          <option value="trial">{{ 'platform.tenants.plans.trial' | transloco }}</option>
          <option value="starter">{{ 'platform.tenants.plans.starter' | transloco }}</option>
          <option value="professional">
            {{ 'platform.tenants.plans.professional' | transloco }}
          </option>
          <option value="enterprise">
            {{ 'platform.tenants.plans.enterprise' | transloco }}
          </option>
        </select>
        @if (showError('plan')) {
          <small [id]="errorIdFor('plan')" class="error">{{
            errorKeyFor('plan') | transloco
          }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'platform.tenantForm.contactName' | transloco }}</span>
        <input
          type="text"
          formControlName="contactName"
          maxlength="200"
          autocomplete="off"
          [attr.aria-invalid]="ariaInvalid('contactName') ? 'true' : null"
          [attr.aria-describedby]="ariaInvalid('contactName') ? errorIdFor('contactName') : null"
        />
        @if (showError('contactName')) {
          <small [id]="errorIdFor('contactName')" class="error">{{
            errorKeyFor('contactName') | transloco
          }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'platform.tenantForm.contactEmail' | transloco }}</span>
        <input
          type="email"
          formControlName="contactEmail"
          autocomplete="off"
          [attr.aria-invalid]="ariaInvalid('contactEmail') ? 'true' : null"
          [attr.aria-describedby]="ariaInvalid('contactEmail') ? errorIdFor('contactEmail') : null"
        />
        @if (showError('contactEmail')) {
          <small [id]="errorIdFor('contactEmail')" class="error">{{
            errorKeyFor('contactEmail') | transloco
          }}</small>
        }
      </label>

      @if (serverError(); as err) {
        <div class="form-error" role="alert">
          {{ errorKey(err) | transloco }}
          @if (err.requestId; as id) {
            <app-error-reference [requestId]="id" />
          }
        </div>
      }

      <div class="actions">
        <a [routerLink]="cancelLink()">{{ 'platform.tenantForm.cancel' | transloco }}</a>
        <button type="submit" [disabled]="submitting() || form.invalid || loadingInitial()">
          {{
            (submitting()
              ? isEditMode()
                ? 'platform.tenantForm.saving'
                : 'platform.tenantForm.creating'
              : submitLabelKey()
            ) | transloco
          }}
        </button>
      </div>
    </form>
  }

  @if (submitting()) {
    <app-loading-state
      [label]="
        (isEditMode() ? 'platform.tenantForm.savingChanges' : 'platform.tenantForm.creatingTenant')
          | transloco
      "
    />
  }
</app-page-container>
