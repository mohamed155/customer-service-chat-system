<main>
  <section>
    <div class="brand">
      <span><tui-icon icon="@tui.sparkles" /></span>
      <strong>{{ 'app.brandName' | transloco }}</strong>
      <small>{{ 'app.tagline' | transloco }}</small>
    </div>
    <h1>{{ title() }}</h1>
    <p>{{ subtitle() }}</p>
    <ng-content />
    <footer><ng-content select="[auth-footer]" /></footer>
  </section>
</main>
