<app-auth-card
  [title]="'auth.forgotPassword.title' | transloco"
  [subtitle]="'auth.forgotPassword.subtitle' | transloco"
>
  <form (submit)="$event.preventDefault()">
    <label>{{ 'auth.email' | transloco }}<input type="email" autocomplete="email" /></label>
    <button type="submit">{{ 'auth.forgotPassword.submit' | transloco }}</button>
  </form>
  <span auth-footer
    ><a [routerLink]="loginUrl">{{ 'auth.backToSignIn' | transloco }}</a></span
  >
</app-auth-card>
