<app-auth-card
  [title]="'auth.forgotPassword.title' | transloco"
  [subtitle]="accepted() ? '' : ('auth.forgotPassword.subtitle' | transloco)"
>
  @if (accepted()) {
    <p role="status">{{ 'auth.forgotPassword.confirmation' | transloco }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'auth.email' | transloco }}
        <input
          type="email"
          autocomplete="email"
          formControlName="email"
          required
          [readOnly]="pending()"
        />
      </label>
      @if (error(); as failure) {
        <p role="alert">
          {{ errorKey(failure) | transloco }}
          @if (failure.requestId; as id) {
            <app-error-reference [requestId]="id" />
          }
        </p>
      }
      <button type="submit" [disabled]="pending() || form.invalid">
        {{ (pending() ? 'auth.forgotPassword.pending' : 'auth.forgotPassword.submit') | transloco }}
      </button>
    </form>
  }
  <span auth-footer
    ><a [routerLink]="loginUrl">{{ 'auth.backToSignIn' | transloco }}</a></span
  >
</app-auth-card>
