<app-auth-card
  [title]="'auth.login.title' | transloco"
  [subtitle]="'auth.login.subtitle' | transloco"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'auth.email' | transloco }}
      <input type="email" autocomplete="email" formControlName="email" />
    </label>
    <label>
      {{ 'auth.password' | transloco }}
      <input type="password" autocomplete="current-password" formControlName="password" />
    </label>
    @if (errorKey(); as key) {
      <p role="alert">{{ key | transloco }}</p>
    }
    <button type="submit" [disabled]="pending() || form.invalid">
      {{ (pending() ? 'auth.login.pending' : 'auth.login.submit') | transloco }}
    </button>
  </form>
  <span auth-footer>
    <a [routerLink]="forgotUrl">{{ 'auth.login.forgot' | transloco }}</a>
    ·
    <a [routerLink]="signupUrl">{{ 'auth.createAccount' | transloco }}</a>
  </span>
</app-auth-card>
