<app-auth-card
  [title]="'auth.mfaChallenge.title' | transloco"
  [subtitle]="
    (usingRecovery() ? 'auth.mfaChallenge.recoverySubtitle' : 'auth.mfaChallenge.codeSubtitle')
      | transloco
  "
>
  <form (submit)="$event.preventDefault(); submit()">
    <label for="mfa-credential">
      {{
        (usingRecovery() ? 'auth.mfaChallenge.recoveryLabel' : 'auth.mfaChallenge.codeLabel')
          | transloco
      }}
      @if (usingRecovery()) {
        <input
          id="mfa-credential"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          [formControl]="credential"
        />
      } @else {
        <input
          id="mfa-credential"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          [formControl]="credential"
        />
      }
    </label>
    @if (errorKey(); as key) {
      <p role="alert">{{ key | transloco }}</p>
    }
    <button type="submit" [disabled]="pending() || credential.invalid">
      {{ (pending() ? 'auth.mfaChallenge.pending' : 'auth.mfaChallenge.submit') | transloco }}
    </button>
  </form>
  <span auth-footer>
    <button type="button" class="link" (click)="toggleRecovery()">
      {{
        (usingRecovery() ? 'auth.mfaChallenge.useCode' : 'auth.mfaChallenge.useRecovery')
          | transloco
      }}
    </button>
    ·
    <a [routerLink]="loginUrl">{{ 'auth.backToSignIn' | transloco }}</a>
  </span>
</app-auth-card>
