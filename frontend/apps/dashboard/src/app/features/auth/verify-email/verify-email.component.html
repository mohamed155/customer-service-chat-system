<app-auth-card
  [title]="'auth.verifyEmail.title' | transloco"
  [subtitle]="'auth.verifyEmail.subtitle' | transloco"
>
  <form (submit)="$event.preventDefault()">
    <div class="otp" [attr.aria-label]="'auth.verifyEmail.codeLabel' | transloco">
      @for (box of boxes; track box) {
        <input
          inputmode="numeric"
          maxlength="1"
          [attr.aria-label]="'auth.verifyEmail.digit' | transloco: { n: box }"
          [class.active]="focusedIndex() === box - 1"
          (focus)="focusedIndex.set(box - 1)"
        />
      }
    </div>
    <button type="submit">{{ 'auth.verifyEmail.submit' | transloco }}</button>
  </form>
  <span auth-footer>
    {{ 'auth.verifyEmail.noCode' | transloco }}
    <a href="" (click)="$event.preventDefault()">{{ 'auth.verifyEmail.resend' | transloco }}</a>
    ·
    <a [routerLink]="loginUrl">{{ 'auth.backToSignIn' | transloco }}</a>
  </span>
</app-auth-card>
