<header>
  <app-icon-button
    icon="@tui.menu"
    [label]="'topbar.toggleSidebar' | transloco"
    [active]="collapsed()"
    [attr.aria-expanded]="!collapsed()"
    (click)="toggleSidebar()"
  />

  <div class="title">
    <strong>{{ pageTitle()?.title ?? 'app.brandName' | transloco }}</strong>
    <span>{{
      pageTitle()?.subtitle ?? 'app.tagline' | transloco: pageTitle()?.subtitleParams
    }}</span>
  </div>

  <div class="tools" [attr.aria-label]="'topbar.tools' | transloco">
    <app-search-input
      class="search"
      [placeholder]="'topbar.search' | transloco"
      shortcutHint="⌘K"
      [(value)]="search"
    />
    @if (isPlatformUser()) {
      @defer (on immediate) {
        <app-platform-nav />
        <app-tenant-switcher />
      }
    }
    <button class="new-button" type="button">
      <tui-icon icon="@tui.plus" /><span class="new-label">{{ 'topbar.new' | transloco }}</span>
    </button>
    @if (canManageConversations()) {
      <app-availability-toggle />
    }
    <app-icon-button
      class="theme-toggle"
      [icon]="themeIcon()"
      [label]="themeLabelKey() | transloco"
      (click)="cycleTheme()"
    />
    <div class="notification-wrapper">
      <app-notification-bell
        [count]="notificationsStore.unreadCount()"
        (togglePanel)="toggleNotificationPanel()"
      />
      @if (notificationPanelOpen()) {
        <div class="notification-dropdown">
          <app-notification-list
            [items]="notificationsStore.items()"
            [loading]="notificationsStore.loading()"
            [hasMore]="notificationsStore.hasMore()"
            (itemClick)="onNotificationClick($event)"
            (markRead)="notificationsStore.markRead($event)"
            (loadMore)="notificationsStore.loadMore()"
          />
        </div>
      }
    </div>
    @if (isAuthenticated()) {
      <app-user-menu />
    }
  </div>
</header>
