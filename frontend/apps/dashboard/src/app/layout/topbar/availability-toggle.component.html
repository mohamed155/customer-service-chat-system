<button
  type="button"
  class="toggle"
  (click)="toggle()"
  [class.available]="state() === 'available'"
  [class.away]="state() === 'away'"
>
  <tui-icon [icon]="state() === 'available' ? '@tui.circle-check' : '@tui.circle-minus'" />
  <span>{{
    (state() === 'available' ? 'availability.available' : 'availability.away') | transloco
  }}</span>
</button>
