@if (update.bannerVisible()) {
  <section class="update-banner" role="status" aria-live="polite">
    <span>{{ 'updateBanner.message' | transloco }}</span>
    <button type="button" (click)="update.reload()">{{ 'common.reload' | transloco }}</button>
    <button
      type="button"
      (click)="update.dismiss()"
      [attr.aria-label]="'updateBanner.dismiss' | transloco"
    >
      {{ 'common.dismiss' | transloco }}
    </button>
  </section>
}
