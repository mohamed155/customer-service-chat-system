<div class="shell">
  <div
    class="sidebar-wrapper"
    [class.drawer]="isMobile()"
    [class.open]="isMobile() && drawerOpen()"
  >
    <app-sidebar [collapsed]="isMobile() ? false : collapsed()" />
  </div>
  @if (isMobile() && drawerOpen()) {
    <div
      class="scrim"
      (click)="closeDrawer()"
      (keydown.enter)="closeDrawer()"
      role="button"
      tabindex="0"
      [attr.aria-label]="'shell.closeDrawer' | transloco"
    ></div>
  }
  <div class="workspace">
    <app-topbar />
    @if (errorMessage(); as message) {
      <section class="tenant-error-banner" role="alert" aria-live="polite">
        <tui-icon icon="@tui.triangle-alert" />
        <span>{{ message }}</span>
        @if (errorRequestId(); as id) {
          <app-error-reference [requestId]="id" />
        }
        <button
          type="button"
          (click)="dismissError()"
          [attr.aria-label]="'shell.dismissAlert' | transloco"
        >
          {{ 'common.dismiss' | transloco }}
        </button>
      </section>
    }
    <main tabindex="-1"><app-breadcrumb /><router-outlet /></main>
  </div>
</div>
