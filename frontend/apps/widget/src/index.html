<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widget</title>
    <base href="/" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* Reduced motion (MOH-74): a visitor who asked their system for less motion gets none. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <hx-widget-root></hx-widget-root>
  </body>
</html>
