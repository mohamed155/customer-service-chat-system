services:
  backend:
    image: ${IMAGE_BASE:-ghcr.io/mohamed155/customer-service-chat-system}-backend:${APP_RELEASE_SHA:?APP_RELEASE_SHA must be set}
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA}
      APP_ENVIRONMENT: staging
    env_file:
      - ../.env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Healthy while /ready answers 200 (PostgreSQL, Redis, object storage; failing from the moment
    # a stop is requested). The image has no curl, so the binary asks itself (MOH-81). This reports
    # state (`docker compose ps`, `docker inspect`); nothing waits on it: ops/deploy.sh gates and
    # rolls back on /ready itself, and a `service_healthy` dependency would make `up -d` fail
    # before that rollback.
    healthcheck:
      test: ["CMD", "server", "healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  dashboard:
    image: ${IMAGE_BASE:-ghcr.io/mohamed155/customer-service-chat-system}-dashboard:${APP_RELEASE_SHA:?APP_RELEASE_SHA must be set}
    ports:
      - "4200:80"

  widget:
    image: ${IMAGE_BASE:-ghcr.io/mohamed155/customer-service-chat-system}-widget:${APP_RELEASE_SHA:?APP_RELEASE_SHA must be set}
    ports:
      - "8082:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    depends_on:
      - backend
      - dashboard
      - widget

volumes:
  caddy_data:
