apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false
    jsonData:
      derivedFields:
        - name: request_id
          matcherType: regex
          matcherRegex: '"request_id":"([^"]+)"'
          datasourceUid: tempo
          urlDisplayLabel: 'Traces for this request'
          url: '{ .request_id = "$${__value.raw}" }'
          internalLink: true
