# Web server for the dashboard and widget images (infra/Dockerfile.frontend).
#
# Three rules, and the second one is the point of MOH-167:
#  1. A route of the single-page app gets index.html. A route can hold a dot (a token or a slug in
#     the last segment), so only the extensions the build and the app serve count as files.
#  2. A missing file of those types is a real 404, never index.html. After a deploy, a page that
#     was opened before it asks for lazy chunks of the old release; if the server answered those
#     with index.html (status 200, wrong content type), the browser would fail in a way the app
#     cannot tell from a bug. A 404 is what the app's chunk-load recovery detects.
#  3. Caching: files with a content hash in their name never change, so they are cached for a
#     year; index.html and every other file must be checked each time, so a new release is seen
#     at once and a reload gets the new chunk names.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output, e.g. main-4TYQZ6FJ.js, styles-QWERTY12.css, chunk-ABCD1234.js.
    location ~ "^/.+-[A-Z0-9]{8}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other file (theme-init.js, icons, fonts, source maps): present or 404.
    location ~* "\.(?:js|mjs|css|map|json|txt|webmanifest|ico|png|jpe?g|gif|webp|svg|woff2?|ttf|otf)$" {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Client routes and the document itself.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
