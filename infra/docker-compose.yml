# Local development services (PostgreSQL + pgvector, Redis, MinIO, Mailpit) plus the optional
# `observability` profile. Staging reuses this file as its base (see docker-compose.staging.yml).
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# Published ports of the four core services are bound to 127.0.0.1 so the dev credentials are not
# reachable from the network. Image tags are pinned; bump them deliberately.

services:
  postgres:
    # pgvector >= 0.8.0 required for hnsw.iterative_scan support
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
      POSTGRES_USER: ${POSTGRES_USER:-customer_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_service_dev}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty data volume (creates the vector / pg_trgm extensions).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 matters: during first-run init the server only listens on the unix socket,
      # so a TCP probe turns healthy only after the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  redis:
    image: redis:8.10.1
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  # Bootstrap: creates the `tenants` and `quarantine` buckets (private), then stays running and
  # reports healthy. It does not exit, because `up --wait` treats an exited container as a failure.
  # Same pinned MinIO build as above, which ships `mc` and `curl`. Idempotent.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./minio/create-buckets.sh:/create-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/buckets-ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    profiles:
      - observability
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      OTEL_TAIL_SAMPLE_PERCENTAGE: "${OTEL_TAIL_SAMPLE_PERCENTAGE:-100}"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - postgres
      - redis

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  node-exporter:
    profiles:
      - observability
    image: prom/node-exporter:v1.12.1
    command:
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    ports:
      - "9100:9100"

  grafana:
    profiles:
      - observability
    image: grafana/grafana:13.2.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    profiles:
      - observability
    image: grafana/loki:3.7.8
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
      - "-target=all"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    profiles:
      - observability
    image: grafana/promtail:3.6.11
    command:
      - "-config.file=/etc/promtail/promtail-config.yaml"
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  alertmanager:
    profiles:
      - observability
    image: prom/alertmanager:v0.34.1
    entrypoint:
      - /etc/alertmanager/entrypoint.sh
    command:
      - "--config.file=/tmp/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      - APP_ALERT_WEBHOOK_URL=${APP_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro

  tempo:
    profiles:
      - observability
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

