# Local development services (PostgreSQL + pgvector, Redis, MinIO, Mailpit) plus the optional
# `observability` profile. Staging reuses this file as its base (see docker-compose.staging.yml).
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# Published ports of the four core services are bound to 127.0.0.1 so the dev credentials are not
# reachable from the network. Image tags are pinned; bump them deliberately.

# MinIO no longer publishes pullable images (quay.io/minio/minio returns 401 and Docker Hub has no
# minio/minio), so this is the Chainguard build of MinIO, pinned by digest: the free tier only has
# the `latest` tag, so the digest is what makes it reproducible. It runs as a non-root user and ships
# `sh` and `mc` but no `curl`. To bump it: `docker pull cgr.dev/chainguard/minio:latest`, then copy
# the new digest from `docker image inspect --format '{{index .RepoDigests 0}}'`.
x-minio-image: &minio-image cgr.dev/chainguard/minio:latest@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d

services:
  postgres:
    # pgvector >= 0.8.0 required for hnsw.iterative_scan support
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
      POSTGRES_USER: ${POSTGRES_USER:-customer_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_service_dev}
      # Passwords for the app_owner / app_runtime roles (init/02-roles.sh). No defaults on purpose:
      # when unset the roles are not created. Set them in .env and pass --env-file .env.
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty data volume (creates the vector / pg_trgm extensions).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      # Authenticates as POSTGRES_USER over TCP and checks the extensions; see the script.
      test: ["CMD", "/bin/bash", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  redis:
    image: redis:8.10.1
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: *minio-image
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # The image has no curl, so the health check uses `mc ready`. MC_HOST_<alias> defines the
      # `local` alias without a config file; credentials containing @ : / must be URL-encoded.
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@localhost:9000
      MC_CONFIG_DIR: /tmp/.mc
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  # Bootstrap: creates the `tenants` and `quarantine` buckets (private), then stays running and
  # reports healthy. It does not exit, because `up --wait` treats an exited container as a failure.
  # Same pinned MinIO image as above, which ships `sh` and `mc`. Idempotent.
  minio-init:
    image: *minio-image
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ./minio/create-buckets.sh:/create-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/buckets-ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      # Without MP_DATABASE Mailpit keeps messages in memory and the volume below stays empty.
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    profiles:
      - observability
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      OTEL_TAIL_SAMPLE_PERCENTAGE: "${OTEL_TAIL_SAMPLE_PERCENTAGE:-100}"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - postgres
      - redis

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  node-exporter:
    profiles:
      - observability
    image: prom/node-exporter:v1.12.1
    command:
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    ports:
      - "9100:9100"

  grafana:
    profiles:
      - observability
    image: grafana/grafana:13.2.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    profiles:
      - observability
    image: grafana/loki:3.7.8
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
      - "-target=all"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    profiles:
      - observability
    image: grafana/promtail:3.6.11
    command:
      - "-config.file=/etc/promtail/promtail-config.yaml"
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  alertmanager:
    profiles:
      - observability
    image: prom/alertmanager:v0.34.1
    entrypoint:
      - /etc/alertmanager/entrypoint.sh
    command:
      - "--config.file=/tmp/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      - APP_ALERT_WEBHOOK_URL=${APP_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro

  tempo:
    profiles:
      - observability
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

